<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حراس النيل - الرئيسية</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

    <style>
        :root {
            --bg-dark: #121828;
            --text-primary: #FFFFFF;
            --text-secondary: #A0AEC0;
            --accent-blue: #38BDF8;
            --font-family: 'Cairo', sans-serif;
        }

        /* --- Global Styles --- */
        body {
            font-family: var(--font-family);
            margin: 0;
            background-color: var(--bg-dark);
            color: var(--text-primary);
        }

        /* --- Navigation --- */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 5%;
        }
        .logo {
            font-weight: 900;
            font-size: 1.5rem;
            color: var(--text-primary);
            text-decoration: none;
        }
        .logo i {
            color: var(--accent-blue);
        }
        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            margin: 0 1rem;
            font-weight: 700;
            transition: color 0.3s;
        }
        .nav-links a:hover, .nav-links a.active {
            color: var(--accent-blue);
        }

        /* --- Hero Section --- */
        .hero-section {
            display: flex;
            align-items: center;
            padding: 2rem 5%;
            min-height: 80vh;
        }
        .hero-text {
            flex: 1;
        }
        .hero-text .subtitle {
            font-weight: 700;
            color: var(--text-secondary);
            letter-spacing: 2px;
            margin-bottom: 1rem;
        }
        .hero-text h1 {
            font-size: 4.5rem;
            font-weight: 900;
            margin: 0;
            line-height: 1.2;
        }
        .hero-text h1 span {
            color: var(--accent-blue);
        }
        .hero-text p {
            font-size: 1.1rem;
            color: var(--text-secondary);
            max-width: 500px;
            line-height: 1.8;
            margin: 2rem 0;
        }
        .hero-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }
        .btn {
            padding: 0.8rem 2rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            transition: all 0.3s;
        }
        .btn-primary {
            background-color: var(--accent-blue);
            color: var(--bg-dark);
        }
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(56, 189, 248, 0.3);
        }
        .btn-secondary {
            background-color: transparent;
            color: var(--accent-blue);
            border: 2px solid var(--accent-blue);
        }
        .btn-secondary:hover {
            background-color: var(--accent-blue);
            color: var(--bg-dark);
        }

        .hero-image {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .hero-image img {
            max-width: 100%;
            height: auto;
            border-radius: 1rem;
        }

        /* --- Responsive Design --- */
        @media (max-width: 992px) {
            .hero-section {
                flex-direction: column;
                text-align: center;
            }
            .hero-text {
                margin-bottom: 3rem;
            }
            .hero-text h1 {
                font-size: 3.5rem;
            }
            .hero-text p {
                margin-left: auto;
                margin-right: auto;
            }
            .hero-buttons {
                justify-content: center;
            }
        }
        @media (max-width: 768px) {
            .nav-links { display: none; } /* Simplified for this example */
            .hero-text h1 { font-size: 2.8rem; }
        }
    </style>
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo"><i class="fa-solid fa-shield-halved"></i> حراس النيل</a>
        <nav class="nav-links">
            <a href="index.html" class="active">الرئيسية</a>
            <a href="map.html">الخريطة الحية</a>
            <a href="about.html">عن المشروع</a>
        </nav>
    </header>

    <main class="hero-section">
        <div class="hero-text">
            <p class="subtitle">مشروع مراقبة جودة المياه</p>
            <h1>امنح <span>النيل</span><br>صوتًا مسموعًا</h1>
            <p>نظام ذكي ومتكامل لمراقبة صحة نهر النيل لحظة بلحظة، باستخدام أجهزة استشعار عائمة وتقارير مدعومة بالذكاء الاصطناعي.</p>
            <div class="hero-buttons">
                <a href="map.html" class="btn btn-primary">اكتشف الخريطة</a>
                <a href="about.html" class="btn btn-secondary">اعرف المزيد</a>
            </div>
        </div>
        <div class="hero-image">
            <img src="image/ancient-egyptian-culture-civilization-from.jpg" alt="Monitoring Dashboard">
        </div>
    </main>

</body>
</html>
