<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحليل بيانات الحارس</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root {
            --bg-main: #F1F5F9; --panel-color: #FFFFFF; --text-primary: #1A202C; --text-secondary: #718096;
            --accent-blue: #3182CE; --status-good: #48BB78; --status-warning: #ECC94B; --status-danger: #E53E3E;
        }
        body.dark-mode {
            --bg-main: #1A202C; --panel-color: #2D3748; --text-primary: #E2E8F0; --text-secondary: #A0AEC0;
        }
        body { font-family: 'Cairo', sans-serif; background-color: var(--bg-main); color: var(--text-primary); margin: 0; padding: 2rem; }
        .container { max-width: 1200px; margin: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; border-bottom: 1px solid #ccc; padding-bottom: 1rem; }
        .header h1 { margin: 0; font-size: 1.8rem; }
        #last-updated-time { font-size: 0.9rem; color: var(--text-secondary); margin-top: 5px; display: block; }
        .analysis-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; }
        .analysis-card { background: var(--panel-color); padding: 1.5rem; border-radius: 10px; border-left: 5px solid gray; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .status-good { border-left-color: var(--status-good); }
        .status-warning { border-left-color: var(--status-warning); }
        .status-danger { border-left-color: var(--status-danger); }
        .card-value { font-size: 2.2rem; font-weight: bold; margin: 10px 0; }
        .chart-card { grid-column: 1 / -1; background: var(--panel-color); padding: 1.5rem; border-radius: 10px; margin-top: 2rem; height: 400px; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-overlay.visible { display: flex; }
        .modal-content { background: var(--panel-color); width: 90%; max-width: 800px; max-height: 90vh; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
        .modal-header { padding: 1rem; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .modal-body { padding: 2rem; overflow-y: auto; color: var(--text-primary); }
        .report-section { margin-bottom: 1.5rem; border-bottom: 1px solid #eee; padding-bottom: 1rem; }
        .report-section h2 { color: var(--accent-blue); font-size: 1.4rem; margin-bottom: 0.5rem; }
        .report-section p { line-height: 1.6; color: var(--text-secondary); }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div>
                <h1 id="guardian-title">جاري التحميل...</h1>
                <span id="last-updated-time"></span>
            </div>
            <div>
                <button onclick="toggleTheme()" style="padding: 10px; cursor: pointer; border-radius: 5px; border: 1px solid #ccc;">🌗 وضع ليلي</button>
                <a href="map.html" style="margin-right: 15px; text-decoration: none; color: var(--accent-blue); font-weight: bold;">العودة للخريطة</a>
            </div>
        </div>

        <div id="analysis-grid" class="analysis-grid"></div>

        <div style="margin-top: 2rem;">
            <button id="ai-analyze-btn" style="width: 100%; padding: 15px; background: linear-gradient(90deg, #3182CE, #805AD5); color: white; border: none; border-radius: 8px; font-size: 1.2rem; cursor: pointer; font-weight: bold;">
                <i class="fa-solid fa-robot"></i> طلب تحليل شامل بالذكاء الاصطناعي
            </button>
            <div class="chart-card">
                <canvas id="readingsChart"></canvas>
            </div>
        </div>
    </div>

    <div id="report-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2>تقرير التحليل الذكي</h2>
                <div>
                    <button id="download-pdf-btn" style="padding: 8px 15px; background: var(--status-good); color: white; border: none; border-radius: 5px; cursor: pointer;">تحميل PDF</button>
                    <button onclick="document.getElementById('report-modal').classList.remove('visible')" style="padding: 8px 15px; margin-right: 5px; cursor: pointer;">إغلاق</button>
                </div>
            </div>
            <div id="modal-body" class="modal-body"></div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const guardianId = params.get('id');

        // 1. جلب البيانات (العقل اليدوي)
        async function fetchData() {
            if (!guardianId) return;
            try {
                // استخدام المتغير response بشكل موحد
                const response = await fetch(`/api/v1/readings/${encodeURIComponent(guardianId)}`);
                
                if (!response.ok) {
                     const errorData = await response.json();
                     throw new Error(errorData.message || `خطأ ${response.status}`);
                }

                const data = await response.json(); // استخدام response هنا
                
                // تحديث العنوان
                document.getElementById('guardian-title').innerHTML = `<i class="fa-solid fa-shield-halved"></i> ${data.guardian_id}`;
                document.getElementById('last-updated-time').textContent = new Date(data.timestamp).toLocaleString('ar-EG');

                // تحديث البطاقات
                const grid = document.getElementById('analysis-grid');
                grid.innerHTML = '';
                const icons = { turbidity: 'fa-water', temperature: 'fa-temperature-half', ph: 'fa-flask', tds: 'fa-droplet', battery: 'fa-battery-full' };
                
                ['turbidity', 'ph', 'tds', 'temperature', 'battery'].forEach(type => {
                    if (data.analysis[type]) {
                        const item = data.analysis[type];
                        grid.innerHTML += `
                            <div class="analysis-card status-${item.status}">
                                <div style="display:flex; align-items:center; gap:10px; color:gray;">
                                    <i class="fa-solid ${icons[type]}"></i> <span>${type.toUpperCase()}</span>
                                </div>
                                <div class="card-value">${Math.round(item.value)}</div>
                                <p>${item.message}</p>
                            </div>
                        `;
                    }
                });

                renderChart(data.history);

            } catch (err) {
                console.error(err);
                document.getElementById('guardian-title').textContent = "لم يتم العثور على بيانات";
            }
        }

        // 2. التحليل الذكي
        document.getElementById('ai-analyze-btn').addEventListener('click', async () => {
            const modal = document.getElementById('report-modal');
            const body = document.getElementById('modal-body');
            modal.classList.add('visible');
            body.innerHTML = '<p style="text-align:center; padding:20px;">جاري استشارة الخبير البيئي...</p>';

            try {
                // استخدام المتغير response بشكل موحد
                const response = await fetch(`/api/v1/ai-analysis/${encodeURIComponent(guardianId)}`);
                const data = await response.json(); // استخدام response هنا

                if (!response.ok || data.error) {
                    throw new Error(data.error || "خطأ غير معروف من الخادم");
                }

                if (data.data_quality) {
                    // لو الرد JSON (منسق)
                    body.innerHTML = `
                        <div class="report-section"><h2>1. جودة البيانات</h2><p>${data.data_quality}</p></div>
                        <div class="report-section"><h2>2. الملخص التنفيذي</h2><p>${data.summary}</p></div>
                        <div class="report-section"><h2>3. التحليل التفصيلي</h2><p>${data.analysis}</p></div>
                        <div class="report-section"><h2>4. التوصيات</h2><p>${data.recommendations}</p></div>
                    `;
                } else if (data.report) {
                    // لو الرد نص Markdown
                    body.innerHTML = marked.parse(data.report);
                } else {
                    body.innerHTML = '<p style="color:red;">حدث خطأ غير متوقع في التنسيق.</p>';
                }
            } catch (err) {
                body.innerHTML = `<p style="color:red;">عذراً، حدث خطأ: ${err.message}</p>`;
            }
        });

        // 3. تحميل PDF
        document.getElementById('download-pdf-btn').addEventListener('click', () => {
            const element = document.getElementById('modal-body');
            const opt = {
                margin: 0.5,
                filename: `Report_${guardianId}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().set(opt).from(element).save();
        });

        function renderChart(history) {
            const ctx = document.getElementById('readingsChart').getContext('2d');
            if (currentChart) currentChart.destroy();
            currentChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: history.map(h => new Date(h.timestamp).toLocaleTimeString()),
                    datasets: [{
                        label: 'Turbidity (العكارة)',
                        data: history.map(h => h.readings.find(r => r.type === 'turbidity')?.value || 0),
                        borderColor: '#3182CE', tension: 0.4, fill: false
                    }]
                }
            });
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
        }

        if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');

        fetchData();
    </script>
</body>
</html>
