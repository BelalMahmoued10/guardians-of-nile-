<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحليل بيانات الحارس</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root {
            /* --- الوضع الفاتح (الافتراضي) --- */
            --bg-main: #F1F5F9;
            --panel-color: #FFFFFF;
            --border-color: #E2E8F0;
            --text-primary: #1A202C;
            --text-secondary: #718096;
            /* --- ألوان مشتركة --- */
            --accent-blue: #3182CE;
            --status-good: #48BB78;
            --status-warning: #ECC94B;
            --status-danger: #E53E3E;
            --status-unknown: #A0AEC0;
            --font-family: 'Cairo', sans-serif;
        }
        
        body.dark-mode {
            --bg-main: #1A202C;
            --panel-color: #2D3748;
            --border-color: #4A5568;
            --text-primary: #E2E8F0;
            --text-secondary: #A0AEC0;
        }
        
        body { 
            font-family: var(--font-family); margin: 0; 
            background-color: var(--bg-main); 
            color: var(--text-primary);
            transition: background-color 0.3s, color 0.3s;
        }
        .container { padding: 2rem; max-width: 1200px; margin: auto; }
        
        .header { 
            display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 1px solid var(--border-color); 
            padding-bottom: 1.5rem; margin-bottom: 2rem;
            transition: border-color 0.3s;
        }
        /* --- **التعديل هنا: إضافة مساحة للعنوان والوقت** --- */
        .header-title-block {
            display: flex;
            flex-direction: column;
        }
        .header h1 { 
            margin: 0; 
            font-size: 2rem; 
        }
        /* --- **الإضافة الجديدة: تنسيق الوقت** --- */
        #last-updated-time {
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 600;
        }
        /* ------------------------------------- */
        .header h1 { margin: 0; font-size: 2rem; }
        .header-controls { display: flex; align-items: center; gap: 1rem; }
        .header a { color: var(--accent-blue); text-decoration: none; font-weight: 600; }
        .header i { margin-left: 0.5rem; }

        #theme-toggle {
            background: var(--panel-color); border: 1px solid var(--border-color);
            color: var(--text-secondary); width: 40px; height: 40px; border-radius: 50%;
            font-size: 1.2rem; cursor: pointer; display: grid;
            place-items: center; transition: all 0.3s;
        }
        #theme-toggle:hover { color: var(--accent-blue); border-color: var(--accent-blue); }

        .analysis-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
        }
        
        .analysis-card {
            background-color: var(--panel-color); border-radius: 0.75rem;
            border: 1px solid var(--border-color); border-left: 5px solid var(--status-good);
            padding: 1.5rem; display: flex; flex-direction: column;
            transition: all 0.3s ease;
        }
        .analysis-card:hover { transform: translateY(-5px); box-shadow: 0 10px 15px rgba(0,0,0,0.1); }
        .analysis-card.status-warning { border-left-color: var(--status-warning); }
        .analysis-card.status-danger { border-left-color: var(--status-danger); }
        .analysis-card.status-unknown { border-left-color: var(--text-secondary); }
        
        .card-header { display: flex; align-items: center; gap: 0.75rem; color: var(--text-secondary); font-size: 1rem; font-weight: 600; }
        .card-value { font-size: 2.5rem; font-weight: 700; margin-top: 0.5rem; }
        .card-value .unit { font-size: 1rem; color: var(--text-secondary); margin-right: 0.25rem; }
        .card-message { margin-top: 1rem; font-size: 0.95rem; line-height: 1.7; flex-grow: 1; }
        
        .icon-temperature { color: #F97316; } .icon-ph { color: #A855F7; }
        .icon-tds { color: #0EA5E9; } .icon-battery { color: #22C55E; }
        .icon-location { color: #EC4899; } .icon-turbidity { color: #795548; }

        .chart-card { 
            grid-column: 1 / -1; height: 400px; 
            border: 1px solid var(--border-color); background-color: var(--panel-color); 
            border-radius: 0.75rem; padding: 1.5rem;
            transition: background-color 0.3s, border-color 0.3s;
        }
        .chart-card h2 { margin-top: 0; }
        
        #ai-analyze-btn {
            grid-column: 1 / -1; padding: 1rem; font-size: 1.1rem; font-weight: 700;
            font-family: var(--font-family); color: #FFFFFF;
            background: linear-gradient(90deg, var(--accent-blue), #A855F7);
            border: none; border-radius: 0.5rem; cursor: pointer; transition: all 0.3s ease;
        }
        #ai-analyze-btn:hover { box-shadow: 0 0 20px rgba(49, 130, 206, 0.5); transform: translateY(-3px); }
        #ai-analyze-btn:disabled { background: var(--text-secondary); cursor: not-allowed; }

        /* --- شاشة عرض التقرير (Modal) --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.7); backdrop-filter: blur(5px);
            z-index: 2000; display: flex; justify-content: center; align-items: center;
            opacity: 0; visibility: hidden; transition: opacity 0.3s, visibility 0.3s;
        }
        .modal-overlay.visible { opacity: 1; visibility: visible; }
        .modal-content {
            background-color: var(--panel-color); border-radius: 0.75rem;
            width: 90%; max-width: 800px; max-height: 90vh;
            display: flex; flex-direction: column;
            transform: scale(0.9); transition: transform 0.3s;
        }
        .modal-overlay.visible .modal-content { transform: scale(1); }
        .modal-header {
            padding: 1rem 1.5rem; border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center;
        }
        .modal-header h2 { margin: 0; font-size: 1.25rem; }
        .modal-header-buttons { display: flex; gap: 0.5rem; }
        
        .modal-close-btn, #download-pdf-btn {
            background: var(--panel-color); border: 1px solid var(--border-color);
            color: var(--text-secondary); width: 36px; height: 36px; border-radius: 50%;
            font-size: 1.1rem; cursor: pointer; display: grid;
            place-items: center; transition: all 0.2s;
        }
        .modal-close-btn:hover, #download-pdf-btn:hover {
            color: var(--accent-blue); border-color: var(--accent-blue);
        }
        #download-pdf-btn { color: var(--status-good); }
        #download-pdf-btn:hover { border-color: var(--status-good); }
        
        .modal-body { padding: 1.5rem; overflow-y: auto; }
        
        /* --- **تنسيق التقرير (لإصلاح PDF)** --- */
        .modal-body h1, .modal-body h2, .modal-body h3, .modal-body h4 {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
            margin-top: 1.5rem;
            margin-bottom: 1rem;
            color: var(--text-primary);
        }
        .modal-body h1 { font-size: 1.8rem; }
        .modal-body h2 { font-size: 1.5rem; }
        .modal-body h3 { font-size: 1.2rem; }
        
        .modal-body p {
            line-height: 1.8;
            margin-bottom: 1rem;
            color: var(--text-secondary);
        }
        .modal-body ul {
            list-style-position: inside;
            padding-right: 1rem;
            margin-bottom: 1rem;
        }
        .modal-body li {
            margin-bottom: 0.5rem;
            line-height: 1.7;
            color: var(--text-secondary);
        }
        .modal-body strong {
            color: var(--text-primary);
            font-weight: 700;
        }
        .modal-body code {
            background-color: var(--border-color);
            padding: 2px 5px;
            border-radius: 4px;
            font-family: monospace;
            color: var(--text-primary);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 id="guardian-title"><i class="fa-solid fa-spinner fa-spin"></i> ...</h1>
            <div class="header-controls">
                <button id="theme-toggle" title="تبديل الوضع">
                    <i class="fa-solid fa-moon"></i>
                </button>
                <a href="map.html"><i class="fa-solid fa-arrow-left"></i> العودة للخريطة</a>
            </div>
        </div>

        <div id="analysis-grid" class="analysis-grid">
            </div>
        
        <div class="analysis-grid" style="margin-top: 1.5rem;">
            <button id="ai-analyze-btn"><i class="fa-solid fa-brain"></i> طلب تحليل شامل بالذكاء الاصطناعي</button>
            <div class="chart-card">
                <h2>تاريخ آخر 15 قراءة</h2>
                <canvas id="readingsChart"></canvas>
            </div>
        </div>
    </div>
    
    <div id="report-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fa-solid fa-file-waveform"></i> تقرير التحليل الذكي</h2>
                <div class="modal-header-buttons">
                    <button id="download-pdf-btn" title="تحميل التقرير كـ PDF">
                        <i class="fa-solid fa-file-arrow-down"></i>
                    </button>
                    <button id="modal-close" class="modal-close-btn">&times;</button>
                </div>
            </div>
            <div id="modal-body" class="modal-body">
                </div>
        </div>
    </div>

    <script>
        // --- 1. تعريف العناصر الأساسية ---
        const guardianTitle = document.getElementById('guardian-title');
        const analysisGrid = document.getElementById('analysis-grid');
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeIcon = themeToggleBtn.querySelector('i');
        const readingsChartCanvas = document.getElementById('readingsChart');
        let currentChart = null; 
        const aiAnalyzeBtn = document.getElementById('ai-analyze-btn');
        const reportModal = document.getElementById('report-modal');
        const modalBody = document.getElementById('modal-body');
        const modalCloseBtn = document.getElementById('modal-close');
        const downloadPdfBtn = document.getElementById('download-pdf-btn');

        // --- 2. قاموس الأيقونات والأسماء ---
        const sensorDisplayInfo = {
            'temperature': { name: 'درجة الحرارة', icon: 'fa-temperature-half', unit: '°C' },
            'ph': { name: 'مستوى الحموضة', icon: 'fa-flask-vial', unit: 'pH' },
            'tds': { name: 'المواد الصلبة الذائبة', icon: 'fa-droplet', unit: 'ppm' },
            'turbidity': { name: 'مستوى العكارة', icon: 'fa-water', unit: 'NTU' },
            'battery': { name: 'مستوى البطارية', icon: 'fa-battery-full', unit: '%' },
            'location': { name: 'آخر إحداثيات', icon: 'fa-location-dot', unit: '' }
        };

        // --- 3. قراءة ID الحارس ---
        const params = new URLSearchParams(window.location.search);
        const guardianId = params.get('id');

        // --- 4. دالة رسم المخطط البياني ---
        const renderChart = (labels, historyData) => {
            if (currentChart) { currentChart.destroy(); }
            const isDarkMode = document.body.classList.contains('dark-mode');
            const gridColor = isDarkMode ? 'rgba(255, 255, 255, 0.1)' : 'rgba(0, 0, 0, 0.1)';
            const textColor = isDarkMode ? 'var(--text-primary)' : 'var(--text-primary)';
            const datasets = [];
            if (historyData.temperature) datasets.push({ label: 'الحرارة (°C)', data: historyData.temperature, borderColor: 'var(--status-danger)', yAxisID: 'y' });
            if (historyData.ph) datasets.push({ label: 'الحموضة (pH)', data: historyData.ph, borderColor: 'var(--accent-blue)', yAxisID: 'y1' });
            if (historyData.tds) datasets.push({ label: 'TDS (ppm)', data: historyData.tds, borderColor: 'var(--status-warning)', yAxisID: 'y2', hidden: true });
            if (historyData.turbidity) datasets.push({ label: 'العكارة (NTU)', data: historyData.turbidity, borderColor: '#795548', yAxisID: 'y2', hidden: true });

            const ctx = readingsChartCanvas.getContext('2d');
            currentChart = new Chart(ctx, {
                type: 'line', data: { labels: labels, datasets: datasets },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    scales: {
                        y: { position: 'left', ticks: { color: textColor }, grid: { color: gridColor }, title: { display: true, text: '°C', color: textColor } },
                        y1: { position: 'right', ticks: { color: textColor }, grid: { drawOnChartArea: false }, title: { display: true, text: 'pH', color: textColor } },
                        y2: { position: 'right', ticks: { color: textColor }, grid: { drawOnChartArea: false }, display: false },
                        x: { ticks: { color: textColor }, grid: { color: gridColor } }
                    },
                    plugins: { legend: { labels: { color: textColor } } }
                }
            });
        };
        
        // --- 5. دالة جلب البيانات (العقل اليدوي) ---
        const fetchDataForGuardian = async () => {
            if (!guardianId) {
                guardianTitle.textContent = "خطأ: لم يتم تحديد حارس";
                return;
            }
            try {
                const response = await fetch(`http://localhost:3000/api/v1/readings/${guardianId}`);
                if (!response.ok) {
                     const errorData = await response.json();
                     throw new Error(errorData.message || `خطأ ${response.status}`);
                }
                const data = await response.json();
                if (!data || !data.analysis) {
                    guardianTitle.textContent = data.message || "لا توجد بيانات تحليل لهذا الحارس";
                    return;
                }
                guardianTitle.innerHTML = `<i class="fa-solid fa-robot"></i> تحليل الحارس: ${data.guardian_id}`;
                analysisGrid.innerHTML = ''; 
                const displayOrder = ['temperature', 'ph', 'tds', 'turbidity', 'battery', 'location'];
                displayOrder.forEach(type => {
                    if (data.analysis[type]) {
                        const item = data.analysis[type];
                        const display = sensorDisplayInfo[type] || { name: type, icon: 'fa-question-circle', unit: '' };
                        let displayValue = (type === 'battery') ? Math.round(item.value) : item.value;
                        const card = document.createElement('div');
                        card.className = `analysis-card status-${item.status}`;
                        card.innerHTML = `
                            <div class="card-header">
                                <i class="fa-solid ${display.icon} icon-${type}"></i>
                                <span>${display.name}</span>
                            </div>
                            <div class="card-value">${displayValue} <span class="unit">${display.unit}</span></div>
                            <p class="card-message">${item.message}</p>
                        `;
                        analysisGrid.appendChild(card);
                    }
                });
                if (data.history && data.history.length > 0) {
                    const labels = data.history.map(r => new Date(r.timestamp).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }));
                    const historyData = {};
                    for (const type in sensorDisplayInfo) {
                        if (type === 'battery' || type === 'location') continue;
                        historyData[type] = data.history.map(r => r.readings ? r.readings.find(s => s && s.type === type)?.value : null);
                    }
                    renderChart(labels, historyData);
                }
            } catch (error) {
                console.error("فشل في جلب بيانات الحارس:", error);
                guardianTitle.innerHTML = `<i class="fa-solid fa-exclamation-triangle"></i> لا يمكن تحميل البيانات`;
                analysisGrid.innerHTML = `<p style="color: var(--status-danger);">${error.message}</p>`;
            }
        };

        // --- 6. دالة جلب التحليل الذكي ---
        async function fetchAIAnalysisReport() {
            aiAnalyzeBtn.disabled = true;
            aiAnalyzeBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> ... جاري تحليل بيانات الحارس';
            modalBody.innerHTML = '<p class="loading">الذكاء الاصطناعي يقوم بتحليل البيانات الآن، يرجى الانتظار...</p>';
            reportModal.classList.add('visible');

            try {
                const response = await fetch(`http://localhost:3000/api/v1/ai-analysis/${guardianId}`);
                const data = await response.json(); 
                
                // **تصحيح: التحقق من الخطأ القادم كـ JSON**
                if (!response.ok || data.error) {
                    throw new Error(data.error || data.report || "خطأ غير معروف من الخادم");
                }

                // **الإصلاح: استخدام marked.js لتحويل التقرير النصي (Markdown)**
                if (data.report) {
                     modalBody.innerHTML = marked.parse(data.report);
                } else {
                    throw new Error("تنسيق الرد غير متوقع من الخادم.");
                }

            } catch (error) {
                modalBody.innerHTML = `<p style="color: var(--status-danger);">عذرًا، حدث خطأ: ${error.message}</p>`;
                console.error("Error fetching AI analysis:", error);
            } finally {
                aiAnalyzeBtn.disabled = false;
                aiAnalyzeBtn.innerHTML = '<i class="fa-solid fa-brain"></i> طلب تحليل شامل بالذكاء الاصطناعي';
            }
        }
        
        // --- 7. دالة تحميل الـ PDF ---
        const downloadReportAsPDF = () => {
            const elementToPrint = document.getElementById('modal-body');
            const headerButtons = document.querySelector('.modal-header-buttons');
            headerButtons.style.display = 'none'; // إخفاء الأزرار
            const options = {
                margin: [0.5, 0.5, 0.5, 0.5],
                filename: `Guardian_Report_${guardianId || 'report'}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { 
                    scale: 2, 
                    useCORS: true, 
                    letterRendering: true,
                    // **تصحيح: تحديد الخلفية بناءً على الوضع**
                    backgroundColor: document.body.classList.contains('dark-mode') ? '#2D3748' : '#FFFFFF' 
                },
                jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' },
                pagebreak: { mode: ['avoid-all', 'css', 'legacy'] },
                enableLinks: true
            };
            
            // **تصحيح: تغيير لون النص للأسود مؤقتًا للطباعة**
            const originalColor = elementToPrint.style.color;
            const originalBodyColor = elementToPrint.style.backgroundColor;
            elementToPrint.style.color = '#000000'; // لون النص أسود
            elementToPrint.style.backgroundColor = '#FFFFFF'; // خلفية بيضاء
            
            // تغيير لون كل الفقرات والعناوين للأسود
            elementToPrint.querySelectorAll('p, li').forEach(el => el.style.color = '#555');
            elementToPrint.querySelectorAll('h1, h2, h3, h4').forEach(el => el.style.color = '#000');


            html2pdf().from(elementToPrint).set(options).save().then(() => {
                headerButtons.style.display = 'flex'; // إعادة إظهار الأزرار
                // إعادة الألوان الأصلية
                elementToPrint.style.color = originalColor;
                elementToPrint.style.backgroundColor = originalBodyColor;
                elementToPrint.querySelectorAll('p, li, h1, h2, h3, h4').forEach(el => el.style.color = '');
            });
        };

        // --- 8. ربط الأحداث ---
        aiAnalyzeBtn.addEventListener('click', fetchAIAnalysisReport);
        modalCloseBtn.addEventListener('click', () => reportModal.classList.remove('visible'));
        downloadPdfBtn.addEventListener('click', downloadReportAsPDF);
        reportModal.addEventListener('click', (e) => {
            if (e.target === reportModal) { reportModal.classList.remove('visible'); }
        });

        const applyTheme = (theme) => {
            if (theme === 'dark') {
                document.body.classList.add('dark-mode');
                if (themeIcon) themeIcon.className = 'fa-solid fa-sun';
            } else {
                document.body.classList.remove('dark-mode');
                if (themeIcon) themeIcon.className = 'fa-solid fa-moon';
            }
            if (guardianId) {
                 fetchDataForGuardian();
            }
        };

        const currentTheme = localStorage.getItem('theme') || 'light';
        applyTheme(currentTheme);

        if (themeToggleBtn) {
            themeToggleBtn.addEventListener('click', () => {
                let theme = 'light';
                if (!document.body.classList.contains('dark-mode')) { theme = 'dark'; }
                localStorage.setItem('theme', theme);
                applyTheme(theme);
            });
        }
        
        // --- 9. التشغيل ---
        fetchDataForGuardian();
    </script>
</body>
</html>
